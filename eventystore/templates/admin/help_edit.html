{% extends 'app.html' %}{% from '_macros.html' import csrf %}{% set section='content' %}{% block title %}Article d'aide — EventyStore{% endblock %}
{% block app %}<div class="page-title"><h1>Article d'aide</h1></div><form method="post" class="card">{{ csrf() }}<div class="form-grid c2"><div class="field"><label>Titre</label><input name="title" value="{{ a.title }}" required></div><div class="field"><label>Rubrique</label><input name="section" value="{{ a.section or '' }}"></div><div class="field"><label>Public</label><select name="audience">{% for k,l in [('all','Tous'),('buyer','Organisateurs'),('vendor','Prestataires')] %}<option value="{{k}}" {{ 'selected' if a.audience==k }}>{{l}}</option>{% endfor %}</select></div><div class="field"><label>Ordre</label><input type="number" name="position" value="{{ a.position or 0 }}"></div></div><div class="field"><label>Contenu (Markdown)</label><textarea name="body" rows="12" required>{{ a.body }}</textarea></div><label class="check"><input type="checkbox" name="published" value="1" {{ 'checked' if a.published }}> Publié</label><div class="row" style="margin-top:.6rem"><button class="btn">Enregistrer</button>{% if a.id %}<button class="btn btn-danger" name="action" value="delete" data-multi>Supprimer</button>{% endif %}</div></form>{% endblock %}
