{% extends 'app.html' %}{% from '_macros.html' import csrf %}{% set section='content' %}{% block title %}Page — EventyStore{% endblock %}
{% block app %}<div class="page-title"><h1>Éditer la page</h1></div><form method="post" class="card">{{ csrf() }}<div class="field"><label>Titre</label><input name="title" value="{{ p.title }}" required></div><div class="field"><label>Adresse (slug)</label><input name="slug" value="{{ p.slug }}"></div><div class="field"><label>Contenu (Markdown)</label><textarea name="body" rows="18" required>{{ p.body }}</textarea></div><label class="check"><input type="checkbox" name="published" value="1" {{ 'checked' if p.published is none or p.published }}> Publiée</label><button class="btn" style="margin-top:.6rem">Enregistrer</button></form>{% endblock %}
