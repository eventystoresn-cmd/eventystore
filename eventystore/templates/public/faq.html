{% extends 'base.html' %}{% block title %}FAQ — EventyStore{% endblock %}
{% block content %}<div class="container" style="padding:2rem 0 3rem;max-width:820px"><h1>Questions fréquentes</h1>
{% for q,a in faq %}<details class="card" style="margin-bottom:.6rem"><summary style="cursor:pointer;font-weight:600">{{ q }}</summary><p style="margin:.6rem 0 0">{{ a }}</p></details>{% endfor %}
{% for a in articles %}<details class="card" style="margin-bottom:.6rem"><summary style="cursor:pointer;font-weight:600">{{ a.title }}</summary><div class="prose">{{ a.body|md }}</div></details>{% endfor %}</div>{% endblock %}
